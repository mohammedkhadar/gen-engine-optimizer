      <text x="980" y="356" font-size="20" font-weight="bold" fill="#F1F5F9">fix</text>
    </g>
    <text x="800" y="460" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#94A3B8">audit → track → fix,</text>
    <text x="800" y="490" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#94A3B8">then verify citations climb</text>
  </g>

  <!-- AFTER panel -->
  <g>
    <rect x="1056" y="132" width="464" height="470" rx="22" fill="#34D399" fill-opacity="0.05" stroke="#34D399" stroke-opacity="0.45"/>
    <text x="1088" y="182" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#34D399">✓ AFTER — cited</text>
    <rect x="1088" y="202" width="400" height="58" rx="14" fill="#8B5CF6" fill-opacity="0.28"/>
    <text x="1288" y="239" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#F1F5F9">Buyer: “Best CRM?”</text>
    <text x="1088" y="300" font-family="Arial,sans-serif" font-size="20" fill="#94A3B8">AI answer cites:</text>
    <rect x="1088" y="314" width="400" height="52" rx="12" fill="#34D399" fill-opacity="0.16" stroke="#34D399" stroke-opacity="0.55"/>
    <text x="1106" y="347" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#F1F5F9">✓ You — acme.com/pricing</text>
    <rect x="1088" y="374" width="400" height="52" rx="12" fill="#34D399" fill-opacity="0.13" stroke="#34D399" stroke-opacity="0.45"/>
    <text x="1106" y="407" font-family="Arial,sans-serif" font-size="19" fill="#F1F5F9">✓ Competitor A — …/vs</text>
    <rect x="1088" y="434" width="400" height="52" rx="12" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.15"/>
    <text x="1106" y="467" font-family="Arial,sans-serif" font-size="19" fill="#94A3B8">· Competitor B — bumped off</text>
    <text x="1088" y="522" font-family="Arial,sans-serif" font-size="20" fill="#34D399">Fixed: FAQ schema · excerpt</text>
    <text x="1088" y="550" font-family="Arial,sans-serif" font-size="20" fill="#34D399">llms.txt · tables</text>
  </g>

  <!-- bottom strip -->
  <g>
    <rect x="80" y="640" width="1440" height="128" rx="20" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="120" y="690" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#F1F5F9">How it works: GEO score → daily tracking → one-click fixes → citations climb</text>
    <text x="120" y="728" font-family="Arial,sans-serif" font-size="21" fill="#94A3B8">Answer-ready 25% · Structured data 20% · E-E-A-T 20% · Crawlability 15% · Freshness 10% · Citability 10%</text>
