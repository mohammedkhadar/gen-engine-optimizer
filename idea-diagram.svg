<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F1A"/>
      <stop offset="1" stop-color="#141B2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="940" fill="url(#bg)"/>
  <rect width="1600" height="940" fill="url(#glow)"/>

  <!-- header -->
  <g transform="translate(80,52)">
    <rect width="56" height="56" rx="13" fill="url(#accent)"/>
    <text x="28" y="40" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="bold" fill="#0B0F1A">C</text>
    <text x="70" y="40" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#F1F5F9">CitedAI — from invisible to cited</text>
  </g>

  <!-- BEFORE panel -->
  <g>
    <rect x="80" y="132" width="464" height="470" rx="22" fill="#F87171" fill-opacity="0.05" stroke="#F87171" stroke-opacity="0.4"/>
    <text x="112" y="182" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#F87171">✕ BEFORE — invisible</text>
    <rect x="112" y="202" width="400" height="58" rx="14" fill="#8B5CF6" fill-opacity="0.28"/>
    <text x="312" y="239" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#F1F5F9">Buyer: “Best CRM?”</text>
    <text x="112" y="300" font-family="Arial,sans-serif" font-size="20" fill="#94A3B8">AI answer cites:</text>
    <rect x="112" y="314" width="400" height="52" rx="12" fill="#34D399" fill-opacity="0.13" stroke="#34D399" stroke-opacity="0.45"/>
    <text x="130" y="347" font-family="Arial,sans-serif" font-size="19" fill="#F1F5F9">✓ Competitor A — …/vs</text>
    <rect x="112" y="374" width="400" height="52" rx="12" fill="#34D399" fill-opacity="0.13" stroke="#34D399" stroke-opacity="0.45"/>
    <text x="130" y="407" font-family="Arial,sans-serif" font-size="19" fill="#F1F5F9">✓ Competitor B — g2 review</text>
    <rect x="112" y="434" width="400" height="52" rx="12" fill="#F87171" fill-opacity="0.1" stroke="#F87171" stroke-opacity="0.4"/>
    <text x="130" y="467" font-family="Arial,sans-serif" font-size="19" fill="#F87171">✕ You — not mentioned</text>
    <text x="112" y="522" font-family="Arial,sans-serif" font-size="20" fill="#64748B">Why: no schema · no FAQs ·</text>
    <text x="112" y="550" font-family="Arial,sans-serif" font-size="20" fill="#64748B">anonymous content</text>
  </g>

  <!-- bridge -->
  <g>
    <rect x="568" y="132" width="464" height="470" rx="18" fill="url(#accent)" fill-opacity="0.14"/>
    <text x="800" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#A78BFA">RANKAI</text>
    <g font-family="Arial,sans-serif" text-anchor="middle">
      <rect x="600" y="320" width="120" height="56" rx="16" fill="#FFFFFF" fill-opacity="0.08"/>
      <text x="660" y="356" font-size="20" font-weight="bold" fill="#F1F5F9">audit</text>
      <text x="740" y="356" font-size="24" fill="#A78BFA">→</text>
      <rect x="760" y="320" width="120" height="56" rx="16" fill="#FFFFFF" fill-opacity="0.08"/>
      <text x="820" y="356" font-size="20" font-weight="bold" fill="#F1F5F9">track</text>
      <text x="900" y="356" font-size="24" fill="#A78BFA">→</text>
