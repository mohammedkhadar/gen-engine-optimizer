<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F1A"/>
      <stop offset="1" stop-color="#141B2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.25" r="0.7">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#FFFFFF" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- hexagon radar motif -->
  <g transform="translate(1180,440)" fill="none" stroke="#34D399" stroke-opacity="0.5">
    <polygon points="0,-190 165,-95 165,95 0,190 -165,95 -165,-95" stroke-width="2"/>
    <polygon points="0,-140 122,-70 122,70 0,140 -122,70 -122,-70" stroke-opacity="0.6"/>
    <polygon points="0,-90 78,-45 78,45 0,90 -78,45 -78,-45" stroke-opacity="0.8"/>
    <polygon points="0,-150 100,-110 140,40 -20,150 -130,60 -60,-120" fill="#34D399" fill-opacity="0.18" stroke="#34D399" stroke-width="3"/>
    <circle cx="0" cy="-190" r="9" fill="#8B5CF6"/>
    <circle cx="165" cy="-95" r="9" fill="#8B5CF6"/>
    <circle cx="165" cy="95" r="9" fill="#8B5CF6"/>
    <circle cx="0" cy="190" r="9" fill="#8B5CF6"/>
    <circle cx="-165" cy="95" r="9" fill="#8B5CF6"/>
    <circle cx="-165" cy="-95" r="9" fill="#8B5CF6"/>
  </g>

  <!-- logo -->
  <g transform="translate(120,110)">
    <rect width="64" height="64" rx="14" fill="url(#accent)"/>
    <text x="32" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#0B0F1A">R</text>
    <text x="80" y="44" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#F1F5F9">RankAI</text>
  </g>

  <!-- headline -->
  <text x="120" y="330" font-family="Arial, sans-serif" font-size="76" font-weight="800" fill="#F8FAFC">AI recommends your</text>
  <text x="120" y="418" font-family="Arial, sans-serif" font-size="76" font-weight="800" fill="#F8FAFC">competitors.</text>
  <text x="120" y="506" font-family="Arial, sans-serif" font-size="76" font-weight="800" fill="url(#accent)">Fix that.</text>

  <text x="120" y="580" font-family="Arial, sans-serif" font-size="30" fill="#94A3B8">Generative Engine Optimization — audit, track &amp; get cited by AI answers</text>

  <!-- engine chips -->
  <g font-family="Arial, sans-serif" font-size="22" fill="#CBD5E1">
    <rect x="120" y="630" width="150" height="52" rx="26" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.15"/>
    <text x="195" y="663" text-anchor="middle">ChatGPT</text>
    <rect x="285" y="630" width="150" height="52" rx="26" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.15"/>
    <text x="360" y="663" text-anchor="middle">Perplexity</text>
    <rect x="450" y="630" width="130" height="52" rx="26" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.15"/>
    <text x="515" y="663" text-anchor="middle">Gemini</text>
    <rect x="595" y="630" width="130" height="52" rx="26" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.15"/>
    <text x="660" y="663" text-anchor="middle">Claude</text>
  </g>

  <!-- footer -->
  <text x="120" y="810" font-family="Arial, sans-serif" font-size="24" fill="#64748B">Audit → Track → Fix → Get cited</text>
  <rect x="1180" y="770" width="300" height="56" rx="14" fill="#F8FAFC"/>
  <text x="1330" y="806" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0B0F1A">rankai.geo — free audit</text>
</svg>
